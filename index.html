<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tạo 買取表 – Bảng giá thu mua</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#f3f1ec;--panel:#fff;--ink:#1c2233;--mute:#6b7185;--line:#d9d6cd;--accent:#1e4fa3;--field:#faf9f6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--panel:#1d2029;--ink:#eceef5;--mute:#9aa0b4;--line:#323646;--field:#252937}}
:root[data-theme="dark"]{--bg:#14161c;--panel:#1d2029;--ink:#eceef5;--mute:#9aa0b4;--line:#323646;--field:#252937}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.5}
.app{display:grid;grid-template-columns:340px 1fr;gap:20px;padding:20px;max-width:1300px;margin:0 auto}
@media(max-width:860px){.app{grid-template-columns:1fr;padding:12px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;align-self:start}
h1{font-size:18px;margin:0 0 12px;font-weight:900}
h2{font-size:14px;margin:16px 0 8px;font-weight:700}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink);font:inherit;font-size:14px}
input[type=color]{padding:2px;height:36px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:6px;padding:10px 14px;cursor:pointer;background:var(--accent);color:#fff}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;display:grid;grid-template-columns:64px 1fr;gap:10px;background:var(--field)}
.thumb{width:64px;height:64px;border:1px dashed var(--mute);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mute);text-align:center;cursor:pointer;overflow:hidden;background-size:cover;background-position:center}
.item .x{grid-column:1/-1;background:transparent;color:var(--mute);border:1px solid var(--line);padding:4px;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mv{grid-column:1/-1;display:flex;gap:6px}.mv button{flex:1;background:transparent;color:var(--ink);border:1px solid var(--line);padding:6px;font-size:13px}
.s-prices{background:var(--c);color:#fff}
.s-pr{display:flex;justify-content:space-between;align-items:baseline;padding:5px 8px;gap:4px}
.s-pr+.s-pr{border-top:1px solid rgba(255,255,255,.45)}
.s-pr span{font-size:13px;font-weight:700}
.s-pr b{font-size:22px;font-weight:900;white-space:nowrap}
.s-pr small{font-size:12px;margin-left:2px}
.c4 .s-pr span{font-size:11px}.c4 .s-pr b{font-size:18px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.chip{padding:4px 8px;font-size:12px;background:transparent;color:var(--mute);border:1px solid var(--line);border-radius:14px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.s-t{justify-content:center}.s-t b{font-size:26px}.c4 .s-t b{font-size:22px}
.frame.cut{background:#fff}.frame.cut img{object-fit:contain;padding:6px}.chip:disabled{opacity:.4}
.s-card{cursor:grab}
.stage{min-width:0}
#fit{margin:0 auto}
#sheet{transform-origin:top left}
.actions{position:sticky;bottom:0;background:var(--panel);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);z-index:5}
@media(max-width:860px){input,select{font-size:16px}.actions button{flex:1 1 40%}}
@media print{.panel{display:none}.app{display:block;padding:0}#fit{width:auto!important;height:auto!important}#sheet{transform:none!important}}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sw button{width:24px;height:24px;padding:0;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
/* ===== Tờ 買取表 (luôn nền sáng để xuất ảnh) ===== */
#sheet{--c:#1e4fa3;width:900px;background:#fffdf6;color:var(--t,#1c1c1c);padding:34px 36px 28px;border:6px solid var(--c);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
.s-head{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:4px double var(--c);padding-bottom:14px;margin-bottom:20px}
.s-shop{font-size:48px;font-weight:900;line-height:1.15;text-align:left;flex:1;min-width:0;overflow-wrap:anywhere}
.s-right{text-align:right;flex:none}
.s-title{font-size:44px;font-weight:900;letter-spacing:.2em;color:var(--c);line-height:1.1;margin:0 0 2px;padding-left:.2em}
.s-date{font-size:15px}
.s-grid{display:grid;gap:16px}
.s-card{border:2px solid var(--c);background:#fff;display:flex;flex-direction:column}
.frame{aspect-ratio:1/1;background:#eee6d4;display:flex;align-items:center;justify-content:center;color:#a99f86;font-size:14px;margin:8px;overflow:hidden}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.f-round img{border-radius:50%}
.f-double{border:3px double var(--c)}
.f-round{border-radius:50%;border:3px solid var(--c)}
.f-plain{border:1px solid #ccc}
.f-corner{border:2px solid var(--c);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c);margin:11px}
.s-name{text-align:center;font-weight:700;padding:2px 8px 8px;font-size:17px;min-height:2.6em;line-height:1.35}
.s-price{background:var(--c);color:#fff;text-align:center;font-weight:900;font-size:26px;padding:6px 4px}
.s-price small{font-size:14px;font-weight:700}
.c4 .s-name{font-size:14px}.c4 .s-price{font-size:20px}.c4 .s-price small{font-size:12px}
.s-foot{margin-top:18px;font-size:13px;border-top:1px solid var(--c);padding-top:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.s-note{flex:1;min-width:0;text-align:left;white-space:pre-line}
.s-place{flex:none;max-width:52%;text-align:right;line-height:1.5}
.s-pl{font-size:28px;font-weight:900;color:var(--c);display:flex;align-items:center;justify-content:flex-end;gap:6px;line-height:1.2}
.s-pin{width:30px;height:30px;display:block}
.s-pt{font-size:28px;font-weight:900;line-height:1.35;margin-top:4px;white-space:pre-line;overflow-wrap:anywhere}
.t-lux .s-pl{color:#c9a24b}

#out{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
#out[hidden]{display:none}
.obox{background:var(--panel);color:var(--ink);border-radius:10px;padding:14px;max-width:560px;width:100%;max-height:100%;overflow:auto}
.obox h2{margin:0 0 8px;font-size:16px}.obox img{width:100%;border:1px solid var(--line);display:block}
.obox p{font-size:13px;margin:8px 0 0}
.obox .btn{display:inline-block;background:var(--accent);color:#fff;font-weight:700;padding:10px 14px;border-radius:6px;text-decoration:none;font-size:14px}
.oa{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* ===== Kiểu khung thêm ===== */
.f-thick{border:6px solid var(--c)}
.f-rounded{border:3px solid var(--c);border-radius:18px}
.f-dashed{border:3px dashed var(--c)}
.f-shadow{border:2px solid var(--c);box-shadow:6px 6px 0 var(--c);margin:8px 14px 14px 8px}
.f-polaroid{border:10px solid #fff;border-bottom-width:28px;box-shadow:0 2px 8px rgba(0,0,0,.4);margin:12px}
.f-gold{border:4px solid #c9a24b;box-shadow:0 0 0 2px #fff,0 0 0 4px #c9a24b;margin:12px}
.f-arch{border:3px solid var(--c);border-radius:50% 50% 0 0/36% 36% 0 0}
.f-ring{border-radius:50%;border:6px double var(--c)}
/* ===== Kiểu thiết kế ===== */
.s-band{text-align:center;margin:-6px 0 18px}
.s-band span{display:inline-block;background:var(--c);color:#fff;font-size:24px;font-weight:900;letter-spacing:.12em;padding:6px 34px;border-radius:30px}
.t-pop{background:#fff4c2!important;background-image:linear-gradient(90deg,rgba(255,255,255,.55) 50%,transparent 50%)!important;background-size:36px 100%!important;border-radius:22px;border-width:8px!important}
.t-pop .s-head{border-bottom:6px solid var(--c)}
.t-pop .s-shop{color:var(--c)}
.t-pop .s-title{color:var(--t,#1c1c1c);letter-spacing:.1em}
.t-pop .s-card{border:3px solid #1c1c1c;border-radius:16px;box-shadow:5px 5px 0 #1c1c1c;overflow:hidden}
.t-pop .s-name{font-weight:900}
.t-pop .s-band span{background:#e83a3a;border:3px solid #1c1c1c;box-shadow:4px 4px 0 #1c1c1c}
.t-lux{background:#15130f!important;color:#e9d9a6!important;border-color:#c9a24b!important}
.t-lux .s-head{border-bottom:4px double #c9a24b}
.t-lux .s-shop,.t-lux .s-title,.t-lux .s-date,.t-lux .s-foot{color:#e9d9a6}
.t-lux .s-card{background:#201c14;border:2px solid #c9a24b}
.t-lux .s-name{color:#f4e8c1}
.t-lux .frame{background:#2b2519;color:#7d6f4b}
.t-lux .s-prices{background:#c9a24b;color:#15130f}
.t-lux .s-pr+.s-pr{border-top-color:rgba(21,19,15,.4)}
.t-lux .s-band span{background:linear-gradient(90deg,#a9822b,#e9d08a,#a9822b);color:#15130f;border-radius:4px}
.t-lux .s-foot{border-top-color:#c9a24b}
.t-sakura{background:#fff3f6!important;border-radius:22px;border-width:5px!important}
.t-sakura .s-head{border-bottom:3px dotted var(--c)}
.t-sakura .s-card{border:2px dashed var(--c);border-radius:14px;overflow:hidden}
.t-sakura .s-band span{background:#fff;color:var(--c);border:3px solid var(--c)}
.t-sakura .s-band span:before{content:"✿ "}.t-sakura .s-band span:after{content:" ✿"}
.t-pop .s-band span:before{content:"★ "}.t-pop .s-band span:after{content:" ★"}
.t-lux .s-band span:before{content:"◆ "}.t-lux .s-band span:after{content:" ◆"}
.imgb{display:flex;gap:6px;flex-wrap:wrap}.imgb button{padding:8px 10px;font-size:13px}
.s-card{position:relative}
.s-logo{height:64px;width:auto;vertical-align:middle;margin-right:14px}
.s-banner{margin:0 0 18px}.s-banner img{width:100%;max-height:180px;object-fit:cover;display:block}
.s-badge{position:absolute;top:6px;left:6px;z-index:2;background:#e83a3a;color:#fff;font-weight:900;font-size:14px;padding:3px 10px;border-radius:4px;line-height:1.3}
.c4 .s-badge{font-size:12px;padding:2px 8px}
.t-lux .s-badge{background:#c9a24b;color:#15130f}
/* ===== Nền bảng ===== */
.bg-cream:not(.t-lux){background:#fffdf6!important}
.bg-white:not(.t-lux){background:#fff!important}
.bg-kraft:not(.t-lux){background:#ead9b9!important}
.bg-stripe:not(.t-lux){background:#fffdf6 linear-gradient(90deg,rgba(0,0,0,.055) 50%,transparent 50%)!important;background-size:40px 100%!important}
.bg-grid:not(.t-lux){background:#fffdf6 linear-gradient(rgba(0,0,0,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.07) 1px,transparent 1px)!important;background-size:26px 26px!important}
.bg-sky:not(.t-lux){background:linear-gradient(180deg,#d9eeff,#fff 70%)!important}
.bg-pink:not(.t-lux){background:linear-gradient(180deg,#ffe3ee,#fff 70%)!important}
.bg-mint:not(.t-lux){background:linear-gradient(180deg,#d8f5e6,#fff 70%)!important}
.bg-sun:not(.t-lux){background:linear-gradient(180deg,#fff0a8,#fff 70%)!important}
.bg-lav:not(.t-lux){background:linear-gradient(180deg,#e7defa,#fff 70%)!important}
.bg-custom:not(.t-lux){background-image:none!important}
.sv{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:6px;background:var(--field)}
.svn{flex:1;min-width:0}.svn b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.svn small{font-size:11px;color:var(--mute)}
.sv button{padding:6px 10px;font-size:13px}
/* ===== Căn đều khối giá ===== */
.s-grid{--rh:42px}.s-grid.c4{--rh:36px}
.s-name{flex:1;display:flex;align-items:center;justify-content:center;padding:4px 8px 8px}
.s-prices{display:flex;flex-direction:column;height:calc(var(--rows,1)*var(--rh));margin-top:auto}
.s-pr{flex:1;align-items:center;padding:0 8px}
/* ===== Tự động đổi giao diện theo màn hình ===== */
#nav,.m{display:none}
@media(max-width:860px){
.d{display:none}.m{display:inline}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.app{display:block;padding:8px}
.panel{border:0;padding:8px}
.v-view .panel{display:none}
.v-edit .stage{position:absolute;left:-10000px;top:0;width:900px}
#list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{grid-template-columns:1fr;margin:0;padding:8px}
.thumb{width:100%;height:auto;aspect-ratio:1/1;font-size:13px}
.item input.n,.item input.pr{padding:10px 8px}.chip{padding:8px 10px}
.mv button{padding:10px 0;font-size:16px}
.actions{position:static;border:0;padding:12px 0}
.actions button{padding:12px 10px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);z-index:20}
#nav button{flex:1;padding:12px 2px;background:transparent;color:var(--ink);border:1px solid var(--line);font-size:13px}
.v-edit #nav [data-v=edit],.v-view #nav [data-v=view],#nav #png2{background:var(--accent);color:#fff;border-color:var(--accent)}
}
</style>
</head>
<body class="v-edit">
<div class="app">
  <div class="panel">
    <h1>買取表 – Tạo bảng giá thu mua</h1>
    <h2 style="margin-top:4px">Bản đã lưu</h2>
    <div style="display:flex;gap:6px"><input id="sname" placeholder="Tên bản, ví dụ: Giá tháng 11"><button type="button" id="sbtn" style="white-space:nowrap">Lưu bản này</button></div>
    <div id="smsg" style="font-size:12px;color:var(--mute);margin:4px 0"></div>
    <div id="saved"></div>
    <label>Tên cửa hàng</label><input id="shop" value="○○リサイクルショップ">
    <label>Tiêu đề</label><input id="title" value="買取表">
    <div class="row">
      <div><label>Ngày áp dụng</label><input id="date" value="2026年11月20日"></div>
      <div><label>Số cột</label><select id="cols"><option>2</option><option>3</option><option selected>4</option></select></div>
    </div>
    <div class="row">
      <div><label>Màu chủ đạo</label><input id="color" type="color" value="#1e4fa3"><div id="sw" class="sw"></div></div>
      <div><label>Kiểu khung ảnh</label>
        <select id="frame"><option value="f-double">Viền đôi</option><option value="f-corner">Viền kép</option><option value="f-round">Tròn</option><option value="f-plain">Đơn giản</option><option value="f-thick">Viền dày</option><option value="f-rounded">Bo góc</option><option value="f-dashed">Nét đứt</option><option value="f-shadow">Bóng đổ</option><option value="f-polaroid">Polaroid</option><option value="f-gold">Vàng</option><option value="f-arch">Vòm</option><option value="f-ring">Vòng đôi</option></select></div>
    </div>
    <div class="row">
      <div><label>Kiểu thiết kế</label>
        <select id="theme"><option value="t-classic">Cổ điển</option><option value="t-pop">Pop vui</option><option value="t-lux">Sang trọng (đen vàng)</option><option value="t-sakura">Sakura nhẹ nhàng</option></select></div>
      <div><label>Khẩu hiệu</label><input id="slogan" value="高価買取中！"></div>
    </div>
    <label>Màu chữ (tên cửa hàng, tên sản phẩm, ngày, ghi chú)</label>
    <div class="row"><div><input id="tc" type="color" value="#1c1c1c"></div><div id="tsw" class="sw" style="margin-top:0;align-items:center"></div></div>
    <div class="row">
      <div><label>Nền bảng</label>
        <select id="bg"><option value="">Theo kiểu thiết kế</option><option value="bg-cream">Kem</option><option value="bg-white">Trắng</option><option value="bg-kraft">Giấy kraft</option><option value="bg-stripe">Sọc dọc</option><option value="bg-grid">Ô vuông</option><option value="bg-sky">Xanh trời</option><option value="bg-pink">Hồng phấn</option><option value="bg-mint">Xanh bạc hà</option><option value="bg-sun">Vàng nắng</option><option value="bg-lav">Tím nhạt</option><option value="bg-custom">Màu tự chọn…</option></select></div>
      <div><label>Màu nền tự chọn</label><input id="bgc" type="color" value="#fff1d6"></div>
    </div>
    <label>Hình trang trí</label>
    <div class="imgb"><button type="button" id="logoB" class="sec">Logo cửa hàng</button><button type="button" id="banB" class="sec">Ảnh banner</button><button type="button" id="clrImg" class="sec">Bỏ hình</button>
      <input id="logof" type="file" accept="image/*" hidden><input id="banf" type="file" accept="image/*" hidden></div>
    <datalist id="bdl"><option value="高価買取"><option value="強化買取"><option value="NEW"><option value="値上がり"><option value="品薄"><option value="要確認"><option value="🔥人気"></datalist>
    <label>Ghi chú cuối bảng</label>
    <input id="foot" value="※価格は状態により変動します。お気軽にご相談ください。">
    <label>Địa điểm thu mua (hiện ở góc dưới bên phải)</label>
    <textarea id="place" rows="3" placeholder="Gõ nội dung tự do, ví dụ: 買取場所：○○店&#10;Để trống thì không hiện"></textarea>
    <label>Chất lượng ảnh tải về</label>
    <select id="q"><option value="2">Thường</option><option value="3">Cao</option><option value="4" selected>Rất cao</option><option value="5">Tối đa</option></select>
    <label>Xóa nền ảnh sản phẩm</label>
    <label style="display:flex;gap:6px;align-items:center;color:var(--ink);font-size:13px;margin:2px 0"><input id="auto" type="checkbox" checked style="width:auto"> Tự động xóa nền khi thêm ảnh</label>
    <label>Độ nhạy xóa nền: <span id="tolv">35</span> (tăng nếu còn sót nền, giảm nếu mất phần sản phẩm)</label>
    <input id="tol" type="range" min="10" max="100" value="35">
    <h2>Sản phẩm</h2>
    <div id="list"></div>
    <div class="actions">
      <button id="bulk" class="sec">Thêm nhiều ảnh</button><input id="bulkf" type="file" accept="image/*" multiple hidden>
      <button id="grid16" class="sec">Tạo bảng 4×4 (16 ô)</button>
      <button id="add">+ Thêm sản phẩm</button>
      <button id="png">Tải ảnh PNG</button>
      <button id="print" class="sec">In</button>
      <button id="reset" class="sec">Xóa hết</button>
    </div>
    <p style="font-size:12px;color:var(--mute)">Bấm vào ô vuông để chọn ảnh. Ảnh được xử lý ngay trên máy bạn, không tải lên máy chủ. Nội dung tự lưu trên thiết bị này. Kéo thả ô trong bảng, hoặc dùng nút ↑ ↓, để đổi chỗ.</p>
  </div>
  <div class="stage"><div id="fit"><div id="sheet"></div></div></div>
</div>

function cutOut(it,cb){
  var im=new Image();
  im.onload=function(){
    var k=Math.min(1,900/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement("canvas");
    c.width=w;c.height=h;
    var x=c.getContext("2d",{willReadFrequently:true});x.drawImage(im,0,0,w,h);
    var d=x.getImageData(0,0,w,h),p=d.data,N=w*h,hist={},best=null,bn=0,i,j,r,g,b;
    function samp(px){i=px*4;var key=(p[i]>>4)+","+(p[i+1]>>4)+","+(p[i+2]>>4),e=hist[key]||(hist[key]={n:0,r:0,g:0,b:0});e.n++;e.r+=p[i];e.g+=p[i+1];e.b+=p[i+2];if(e.n>bn){bn=e.n;best=e}}
    for(j=0;j<w;j++){samp(j);samp((h-1)*w+j)}
    for(j=0;j<h;j++){samp(j*w);samp(j*w+w-1)}
    r=best.r/best.n;g=best.g/best.n;b=best.b/best.n;
    var T=+$("tol").value,T2=T*T*3,bg=new Uint8Array(N),q=new Int32Array(N),qh=0,qt=0;
    function near(px){i=px*4;var dr=p[i]-r,dg=p[i+1]-g,db=p[i+2]-b;return dr*dr+dg*dg+db*db<=T2}
    function push(px){if(!bg[px]&&near(px)){bg[px]=1;q[qt++]=px}}
    for(j=0;j<w;j++){push(j);push((h-1)*w+j)}
    for(j=0;j<h;j++){push(j*w);push(j*w+w-1)}
    while(qh<qt){var px=q[qh++],cx=px%w;if(cx>0)push(px-1);if(cx<w-1)push(px+1);if(px>=w)push(px-w);if(px<N-w)push(px+w)}
    var x0=w,y0=h,x1=-1,y1=-1;
    for(j=0;j<N;j++){
      if(bg[j]){p[j*4+3]=0;continue}
      var ax=j%w,ay=(j/w)|0;
      if((ax>0&&bg[j-1])||(ax<w-1&&bg[j+1])||(ay>0&&bg[j-w])||(ay<h-1&&bg[j+w]))p[j*4+3]=170;
      if(ax<x0)x0=ax;if(ax>x1)x1=ax;if(ay<y0)y0=ay;if(ay>y1)y1=ay;
    }
    if(x1<0){it.cut="";it.rm=false;cb();alert("Không tách được nền ảnh này. Hãy giảm độ nhạy hoặc dùng ảnh có nền đơn giản.");return}
    x.putImageData(d,0,0);
    var m=Math.round(Math.max(w,h)*0.02),sx=Math.max(0,x0-m),sy=Math.max(0,y0-m),sw=Math.min(w,x1+m+1)-sx,sh=Math.min(h,y1+m+1)-sy,o=document.createElement("canvas");
    o.width=sw;o.height=sh;o.getContext("2d").drawImage(c,sx,sy,sw,sh,0,0,sw,sh);
    it.cut=o.toDataURL("image/png");cb();
  };
  im.src=it.img;
}
